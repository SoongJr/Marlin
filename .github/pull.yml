version: "1"
# verify this config file (after commit): https://pull-validation-uxx737qt0sl1.runkit.sh/?url=https%3A%2F%2Fraw.githubusercontent.com%2FSoongJr%2FMarlin%2Fpullbot%2F.github%2Fpull.yml
# manuall trigger a pull: https://pull.git.ci/process/SoongJr/Marlin
rules:                      # Array of rules
  - base: 2.0.x             # Required. Target branch
    upstream: MarlinFirmware:2.0.x     # Required. Must be in the same fork network.
    mergeMethod: hardreset  # Optional, one of [none, merge, squash, rebase, hardreset], Default: none.
    mergeUnstable: true     # Optional, merge pull request even when the mergeable_state is not clean. Default: false
  - base: bugfix-2.0.x             # Required. Target branch
    upstream: MarlinFirmware:bugfix-2.0.x     # Required. Must be in the same fork network.
    mergeMethod: hardreset  # Optional, one of [none, merge, squash, rebase, hardreset], Default: none.
    mergeUnstable: true     # Optional, merge pull request even when the mergeable_state is not clean. Default: false

  - base: 2.1.x             # Required. Target branch
    upstream: MarlinFirmware:2.1.x     # Required. Must be in the same fork network.
    mergeMethod: hardreset  # Optional, one of [none, merge, squash, rebase, hardreset], Default: none.
    mergeUnstable: true     # Optional, merge pull request even when the mergeable_state is not clean. Default: false
  - base: bugfix-2.1.x             # Required. Target branch
    upstream: MarlinFirmware:bugfix-2.1.x     # Required. Must be in the same fork network.
    mergeMethod: hardreset  # Optional, one of [none, merge, squash, rebase, hardreset], Default: none.
    mergeUnstable: true     # Optional, merge pull request even when the mergeable_state is not clean. Default: false
label: ":arrow_heading_down: pull"  # Optional
conflictLabel: "merge-conflict"     # Optional, on merge conflict assign a custom label, Default: merge-conflict
